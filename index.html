<style>
/* Layout: one-screen drafting app — header, full-bleed drawing stage, thumb toolbar, sliding sheet. */
:root {
  --bg: #e9edf3;
  --panel: #ffffff;
  --paper: #fafbfd;
  --grid: #e2e7ef;
  --grid-major: #c9d2df;
  --axis: #a9b8d6;
  --ink: #1c2330;
  --muted: #5e6a7b;
  --line: #d3dae4;
  --accent: #1f4fd1;
  --accent-ink: #ffffff;
  --accent-soft: #e3eafc;
  --markup: #cf4419;
  --fill: rgba(31, 79, 209, 0.07);
  --danger: #c22f2f;
  --shadow: 0 6px 24px rgba(20, 30, 50, 0.14);
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --panel: #181d26; --paper: #131821; --grid: #1f2732; --grid-major: #2b3544; --axis: #3a4c74;
    --ink: #e5eaf2; --muted: #95a1b4; --line: #2a3341; --accent: #7398ff; --accent-ink: #0a0f1d; --accent-soft: #1f2a46;
    --markup: #ff8a5b; --fill: rgba(115, 152, 255, 0.10); --danger: #ff6b6b; --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131a; --panel: #181d26; --paper: #131821; --grid: #1f2732; --grid-major: #2b3544; --axis: #3a4c74;
  --ink: #e5eaf2; --muted: #95a1b4; --line: #2a3341; --accent: #7398ff; --accent-ink: #0a0f1d; --accent-soft: #1f2a46;
  --markup: #ff8a5b; --fill: rgba(115, 152, 255, 0.10); --danger: #ff6b6b; --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--f-body); -webkit-user-select: none; user-select: none; touch-action: none; }
button { font: inherit; color: inherit; }
input, select { font: inherit; color: var(--ink); -webkit-user-select: text; user-select: text; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }

/* Header */
header {
  min-width: 0; display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); z-index: 5;
}
.brand { display: flex; align-items: center; gap: 8px; font: 600 18px/1 var(--f-display); letter-spacing: 0.01em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; }
.brand small { font: 500 10px/1 var(--f-mono); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; font-weight: 600; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
header .seg { margin-left: auto; }
.iconbtn { border: 0; background: transparent; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.iconbtn:active { background: var(--bg); }
.iconbtn[disabled] { opacity: .35; }

/* Stage */
#stage { position: relative; overflow: hidden; background: var(--paper); }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hint {
  position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left, 0px)); right: 64px; z-index: 3;
  display: flex; gap: 8px; align-items: flex-start; pointer-events: none;
}
.hint p { margin: 0; max-width: 34em; padding: 7px 11px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; color: var(--muted); font-size: 12.5px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.hint p b { color: var(--ink); font-weight: 600; }
.chip { font: 600 11px/1 var(--f-mono); letter-spacing: .04em; padding: 6px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.warn { background: color-mix(in srgb, var(--markup) 15%, var(--panel)); color: var(--markup); }
.side { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; z-index: 3; display: flex; flex-direction: column; gap: 6px; }
.side .iconbtn { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.views { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; z-index: 3; display: flex; flex-direction: column; gap: 6px; }
.views button { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 7px 0; width: 52px; font: 600 11px/1 var(--f-mono); letter-spacing: .05em; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.fab {
  position: absolute; z-index: 4; right: max(14px, env(safe-area-inset-right, 0px)); bottom: 14px;
  display: flex; align-items: center; gap: 8px; border: 0; border-radius: 14px; padding: 12px 18px 12px 14px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px; box-shadow: var(--shadow); cursor: pointer;
}
.fab:active { transform: translateY(1px); }

/* Toolbar */
nav.toolbar {
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; background: var(--panel); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6px) max(8px, env(safe-area-inset-left, 0px));
  z-index: 5;
}
nav.toolbar::-webkit-scrollbar { display: none; }
.tool { flex: 1 0 58px; min-width: 58px; border: 0; background: transparent; border-radius: 11px; padding: 6px 4px 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 500; }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.tool:active { background: var(--bg); }
.tool[disabled] { opacity: .35; }
.tool.sep { flex: 0 0 1px; min-width: 1px; padding: 0; margin: 8px 3px; background: var(--line); }

/* Sheet */
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; max-height: 72%; overflow-y: auto;
  background: var(--panel); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  transform: translateY(105%); transition: transform .22s ease; touch-action: pan-y;
}
.sheet.open { transform: none; }
.sheet .grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 2px auto 10px; }
.sheet h2 { font: 600 17px/1.2 var(--f-display); margin: 0; letter-spacing: .01em; }
.sheet .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; font-family: var(--f-mono); }
.sheet .head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.sheet .head > div { flex: 1; min-width: 0; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px 10px; margin-bottom: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font: 600 10.5px/1 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.field .box { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 0 10px; }
.field .box:focus-within { border-color: var(--accent); }
.field input { width: 100%; min-width: 0; border: 0; background: transparent; padding: 9px 0; font: 500 16px/1 var(--f-mono); font-variant-numeric: tabular-nums; outline: none; }
.field .unit { color: var(--muted); font: 500 12px/1 var(--f-mono); }
.field input[type="text"] { font-family: var(--f-body); }
.big input { font-size: 26px; padding: 12px 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 11px; padding: 10px 14px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.btn svg.i { width: 18px; height: 18px; }
.btn.sm { padding: 7px 10px; font-size: 13px; border-radius: 9px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.grow { flex: 1; justify-content: center; }
.btn:active { transform: translateY(1px); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.swatches { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.swatches button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--panel); outline: 1px solid var(--line); cursor: pointer; }
.swatches button[aria-pressed="true"] { outline: 2px solid var(--accent); }
.note { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
.section-label { font: 600 10.5px/1 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 4px 0 8px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

/* Menu */
.menu { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 54px); right: max(10px, env(safe-area-inset-right, 0px)); z-index: 20; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; min-width: 220px; }
.menu button { display: flex; width: 100%; gap: 10px; align-items: center; border: 0; background: transparent; padding: 10px 12px; border-radius: 9px; text-align: left; cursor: pointer; }
.menu button:active { background: var(--bg); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.menu svg.i { width: 18px; height: 18px; color: var(--muted); }

/* Toast */
.toast { pointer-events: none; position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 30; display: flex; gap: 12px; align-items: center; background: var(--ink); color: var(--panel); padding: 10px 14px; border-radius: 12px; box-shadow: var(--shadow); font-size: 13.5px; max-width: calc(100% - 32px); }
.toast button { pointer-events: auto; border: 0; background: transparent; color: var(--accent-soft); font-weight: 700; padding: 2px 4px; cursor: pointer; white-space: nowrap; }
.toast span { min-width: 0; }

.help { line-height: 1.5; }
.help ol { padding-left: 20px; margin: 0 0 12px; }
.help li { margin-bottom: 6px; }
.help kbd { font: 600 11px var(--f-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }

@media (max-width: 420px) {
  .brand small { display: none; }
  .seg button { padding: 6px 11px; }
}
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
</style>
</head>

  <defs>

    <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></symbol>

</svg>

<div id="app">
  <header>
    <div class="brand"><svg aria-hidden="true"><use href="#i-logo"/></svg><span>Napkin CAD</span><small id="unit-chip">mm</small></div>
    <div class="seg" role="group" aria-label="Workspace">
      <button id="mode-sketch" aria-pressed="true">Sketch</button>
      <button id="mode-3d" aria-pressed="false">3D</button>
    </div>
    <button class="iconbtn" id="btn-undo" aria-label="Undo"><svg class="i"><use href="#i-undo"/></svg></button>
    <button class="iconbtn" id="btn-redo" aria-label="Redo"><svg class="i"><use href="#i-redo"/></svg></button>
    <button class="iconbtn" id="btn-menu" aria-label="Menu" aria-haspopup="true"><svg class="i"><use href="#i-dots"/></svg></button>
  </header>

  <main id="stage">
    <canvas id="sketch"></canvas>
    <canvas id="view3d" hidden></canvas>
    <div class="hint" id="hint"><p id="hint-text"></p><span class="chip" id="scale-chip" hidden></span></div>
    <div class="side" id="sketch-side">
      <button class="iconbtn" id="btn-fit" aria-label="Fit sketch to screen"><svg class="i"><use href="#i-fit"/></svg></button>
    </div>
    <div class="views" id="views3d" hidden>
      <button data-view="iso">ISO</button>
      <button data-view="top">TOP</button>
      <button data-view="front">FRONT</button>
      <button data-view="right">RIGHT</button>
      <button data-view="fit">FIT</button>
    </div>
    <button class="fab" id="btn-make3d"><svg class="i"><use href="#i-cube"/></svg>Make 3D</button>
    <section class="sheet" id="sheet" aria-live="polite"></section>
    <div class="menu" id="menu" hidden>
      <button data-act="new"><svg class="i"><use href="#i-plus"/></svg>New project</button>
      <button data-act="example"><svg class="i"><use href="#i-file"/></svg>Load example bracket</button>
      <hr>
      <button data-act="open"><svg class="i"><use href="#i-upload"/></svg>Open project (.json)</button>
      <button data-act="save"><svg class="i"><use href="#i-download"/></svg>Save project (.json)</button>
      <hr>
      <button data-act="stl"><svg class="i"><use href="#i-download"/></svg>Export STL (3D print)</button>
      <button data-act="obj"><svg class="i"><use href="#i-download"/></svg>Export OBJ</button>
      <hr>
      <button data-act="help"><svg class="i"><use href="#i-help"/></svg>How it works</button>
    </div>
    <div class="toast" id="toast" hidden><span id="toast-text"></span><button id="toast-btn" hidden></button></div>
  </main>

  <nav class="toolbar" id="tb-sketch" aria-label="Sketch tools">
    <button class="tool" data-tool="draw" aria-pressed="true"><svg class="i"><use href="#i-pen"/></svg>Draw</button>
    <button class="tool" data-tool="dim"><svg class="i"><use href="#i-dim"/></svg>Dimension</button>
    <button class="tool" data-tool="select"><svg class="i"><use href="#i-select"/></svg>Select</button>
    <button class="tool" data-tool="line"><svg class="i"><use href="#i-line"/></svg>Line</button>
    <button class="tool" data-tool="rect"><svg class="i"><use href="#i-rect"/></svg>Rect</button>
    <button class="tool" data-tool="circle"><svg class="i"><use href="#i-circle"/></svg>Circle</button>
    <button class="tool" data-tool="erase"><svg class="i"><use href="#i-erase"/></svg>Erase</button>
    <span class="tool sep" aria-hidden="true"></span>
    <button class="tool" id="btn-photo"><svg class="i"><use href="#i-image"/></svg>Photo</button>
    <button class="tool" id="btn-clear"><svg class="i"><use href="#i-trash"/></svg>Clear</button>
  </nav>
  <nav class="toolbar" id="tb-3d" aria-label="3D tools" hidden>
    <button class="tool" data-add="box"><svg class="i"><use href="#i-cube"/></svg>Box</button>
    <button class="tool" data-add="cyl"><svg class="i"><use href="#i-cyl"/></svg>Cylinder</button>
    <button class="tool" data-add="sphere"><svg class="i"><use href="#i-sphere"/></svg>Sphere</button>
    <button class="tool" data-add="cone"><svg class="i"><use href="#i-cone"/></svg>Cone</button>

function processInk() {

  const all = strokes.flat(); const b = bbox(all); const center = [(b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2];
  const r = Digits.read(strokes);
  // nearest target
  let best = null; const cw = toW(center);
  for (const sh of shapes()) {
    if (sh.type === 'circle') { const d = Math.abs(V.dist(cw, sh.c) - sh.r) * view.s; const dc = V.dist(cw, sh.c) * view.s; const dd = Math.min(d, dc); if (!best || dd < best.d) best = { d: dd, sh }; continue; }

  lastInk = r;

}

    <div class="fields" id="op-fields"></div>
    <div class="row"><button class="btn primary grow" id="op-go"><svg class="i"><use href="#i-cube"/></svg>Create part</button></div>`, { kind: 'make3d' });
  let op = lastOp;

    $('#op-extrude').setAttribute('aria-pressed', op === 'extrude'); $('#op-revolve').setAttribute('aria-pressed', op === 'revolve');
    if (op === 'extrude') { $('#op-note').textContent = 'Pushes every closed outline up into a solid. Shapes drawn inside an outline become holes.'; $('#op-fields').innerHTML = field('op-depth', 'Thickness', store.get('napkin.depth') || '10', 'mm', 'big'); }

    let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]]; const l = Math.hypot(...n) || 1; n = n.map((x) => x / l);

function toOBJ(list) {

    const tris = collectTris([p]);

  }

}
async function exportModel(kind, list = doc.parts) {
  if (!list.length) return toast('Nothing to export yet. Make a part first.');
  if (!T.ready) init3D();
  const base = (list.length === 1 ? list[0].name : 'napkin-model').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'model';
  if (kind === 'stl') await saveFile(base + '.stl', toSTL(list)); else await saveFile(base + '.obj', toOBJ(list));
}
// Minimal store-only ZIP, used where a host accepts .zip but not .stl.
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  const nm = new TextEncoder().encode(name), crc = crc32(data), sz = data.length;
  const lh = new DataView(new ArrayBuffer(30)); lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true); lh.setUint16(26, nm.length, true);
  const cd = new DataView(new ArrayBuffer(46)); cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(14, 0x21, true); cd.setUint32(16, crc, true); cd.setUint32(20, sz, true); cd.setUint32(24, sz, true); cd.setUint16(28, nm.length, true); cd.setUint32(42, 0, true);

let dlCap;
async function saveFile(name, data) {
  const bytes = typeof data === 'string' ? new TextEncoder().encode(data) : data;
  if (window.claude && window.claude.use) {
    if (dlCap === undefined) { try { dlCap = await window.claude.use('downloads'); } catch { dlCap = null; } }
    if (dlCap) {
      const ext = name.split('.').pop(); const ok = ['json', 'txt', 'zip', 'svg', 'png', 'csv'].includes(ext);
      const fname = ok ? name : name.replace(/\.[^.]+$/, '') + '-' + ext + '.zip';
      try { await dlCap.save({ filename: fname, data: ok ? new Blob([bytes]) : zipOne(name, bytes) }); toast(ok ? `Saved ${fname}` : `Saved ${fname} (unzip for the .${ext})`); }
      catch (e) { if (e && e.code !== 'declined') toast('Could not save the file here.'); }
      return;
    }
  }
  const file = new File([bytes], name, { type: 'application/octet-stream' });

  }
  const url = URL.createObjectURL(file); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);

}

/* =========================================================================
   UI wiring: modes, toolbar, menu, toast, hints, photo underlay
   ========================================================================= */
let mode = 'sketch';
function setMode(m) {
  mode = m; const is3 = m === '3d';
  $('#mode-sketch').setAttribute('aria-pressed', !is3); $('#mode-3d').setAttribute('aria-pressed', is3);
  $('#sketch').hidden = is3; $('#view3d').hidden = !is3; $('#tb-sketch').hidden = is3; $('#tb-3d').hidden = !is3;
  $('#sketch-side').hidden = is3; $('#views3d').hidden = !is3;
  closeSheet(); pickMode = null;
  if (is3) { init3D(); resize3D(); refresh3DSelection(); } else resizeSketch();
  updateHint(); updateFab();
}
function updateFab() { $('#btn-make3d').hidden = mode !== 'sketch' || sheet.classList.contains('open') || !shapes().length; }
const HINTS = {
  draw: '<b>Draw</b> with your finger. Lines snap straight and outlines close where you started. Two fingers pan and zoom.',
  dim: '<b>Write a number</b> next to a line or circle, or tap the line to type it. The first one sets the scale.',
  select: '<b>Tap</b> a point, edge or shape to edit it. Drag to move. Drag empty paper to pan.',
  line: '<b>Drag</b> to draw a straight line. Ends join up; close the loop to make an outline.',
  rect: '<b>Drag</b> from corner to corner. Snaps to the grid.',
  circle: '<b>Drag</b> from the center outward.',
  erase: '<b>Tap or swipe</b> over a shape to delete it.',
};
function updateHint() {
  const h = $('#hint'); const chip = $('#scale-chip');
  if (mode === '3d') { $('#hint-text').innerHTML = doc.parts.length ? '<b>Tap</b> a part to edit it, then drag it to move. One finger orbits, two fingers zoom and pan.' : 'No parts yet. Add a box, or sketch an outline and tap <b>Make 3D</b>.'; chip.hidden = true; return; }
  $('#hint-text').innerHTML = HINTS[tool];
  const unscaled = shapes().length && !sketchCalibrated();
  chip.hidden = !unscaled; chip.className = 'chip warn'; chip.textContent = 'NOT TO SCALE';
  h.hidden = false;
}
function setTool(t) {
  tool = t; document.querySelectorAll('#tb-sketch [data-tool]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.tool === t));
  if (t !== 'select') { sel = null; if (sheetFor && sheetFor.kind !== 'make3d') closeSheet(); }
  if (live.handwriting.length) processInk();
  updateHint(); render();
}
document.querySelectorAll('#tb-sketch [data-tool]').forEach((b) => (b.onclick = () => setTool(b.dataset.tool)));
document.querySelectorAll('#tb-3d [data-add]').forEach((b) => (b.onclick = () => addPrimitive(b.dataset.add)));
$('#mode-sketch').onclick = () => setMode('sketch'); $('#mode-3d').onclick = () => setMode('3d');
$('#btn-to-sketch').onclick = () => setMode('sketch');
$('#btn-stl').onclick = () => exportModel('stl');
$('#btn-make3d').onclick = openMake3D;
$('#btn-undo').onclick = undo; $('#btn-redo').onclick = redo;
$('#btn-fit').onclick = () => { fitSketch(); render(); persist(); };
$('#btn-clear').onclick = () => { if (!shapes().length) return; doc.sketch.shapes = []; sel = null; closeSheet(); commit(); render(); updateHint(); toast('Sketch cleared', { label: 'Undo', fn: undo }); };
$('#views3d').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });

function fitSketch() {
  const all = shapes().flatMap((s) => (s.type === 'circle' ? [V.sub(s.c, [s.r, s.r]), V.add(s.c, [s.r, s.r])] : s.pts));
  if (!all.length) { view = { cx: 0, cy: 0, s: 4 }; return; }
  const b = bbox(all); view.cx = (b.x0 + b.x1) / 2; view.cy = (b.y0 + b.y1) / 2 - 8 / view.s;
  view.s = clamp(Math.min((sk.W - 110) / Math.max(b.w, 1), (sk.H - 200) / Math.max(b.h, 1)), 0.05, 400);
}

// Menu
const menu = $('#menu');
function closeMenu() { menu.hidden = true; }
$('#btn-menu').onclick = (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; };
document.addEventListener('pointerdown', (e) => { if (!menu.hidden && !e.target.closest('#menu') && !e.target.closest('#btn-menu')) closeMenu(); });
menu.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return; closeMenu();
  const act = b.dataset.act;
  if (act === 'new') { doc.sketch.shapes = []; clearParts(); sel = null; sel3 = null; clearUnderlay(); view = { cx: 0, cy: 0, s: 4 }; commit(); setMode('sketch'); setTool('draw'); toast('New project', { label: 'Undo', fn: undo }); }
  if (act === 'example') { loadExample(); commit(); }
  if (act === 'save') saveFile('napkin-project.json', JSON.stringify({ app: 'napkin-cad', version: 1, ...JSON.parse(serialize()) }, null, 1));
  if (act === 'open') $('#file-open').click();
  if (act === 'stl') exportModel('stl');
  if (act === 'obj') exportModel('obj');
  if (act === 'help') showHelp();
});
$('#file-open').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.sketch || !Array.isArray(d.parts)) throw new Error(); hist.undo.push(hist.cur); hist.cur = JSON.stringify({ sketch: d.sketch, parts: d.parts }); restore(hist.cur); fitSketch(); render(); toast(`Opened ${f.name}`); }
  catch { toast('That file isn’t a Napkin CAD project.'); }
};
function showHelp() {
  openSheet(`<div class="head"><div><h2>From napkin to part</h2><div class="sub">Sketch → dimension → 3D → print</div></div><button class="iconbtn" data-close aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="help"><ol>
    <li><b>Draw</b> the outline with your finger. Wobbly lines straighten and snap to 90° and 45°. Finish where you started to close it. Draw circles inside for holes.</li>
    <li>Switch to <b>Dimension</b> and write the size next to an edge, e.g. <kbd>80</kbd>. The first number scales the whole sketch to real millimetres; later ones reshape it while keeping the angles.</li>
    <li>If a number is misread, tap <b>Fix</b> and type it. The app learns your handwriting.</li>
    <li>Tap <b>Make 3D</b>: <b>Extrude</b> gives the outline a thickness, <b>Revolve</b> spins a half-profile into a round part.</li>
    <li>In <b>3D</b>, add boxes or cylinders, drag them into place, then <b>Cut away</b> or <b>Join</b>. Export <b>STL</b> for a 3D printer.</li>
  </ol>
  <p class="note">Tip: tap <b>Photo</b> to put a picture of a paper sketch under the grid and trace over it. With a stylus, your finger pans and the pen draws.</p></div>`, { kind: 'help' });
}

// Toast
let toastT = 0;
function toast(msg, action, ms = 3600) {
  const t = $('#toast'); $('#toast-text').textContent = msg; const b = $('#toast-btn');
  if (action) { b.hidden = false; b.textContent = action.label; b.onclick = () => { hideToast(); action.fn(); }; } else b.hidden = true;
  t.hidden = false; t.style.bottom = sheet.classList.contains('open') ? `${sheet.offsetHeight + 12}px` : '';
  clearTimeout(toastT); toastT = setTimeout(hideToast, action ? Math.max(ms, 5000) : ms);
}
function hideToast() { $('#toast').hidden = true; }

// Photo underlay (trace a paper sketch)
$('#btn-photo').onclick = () => { if (underlay) openUnderlaySheet(); else $('#file-photo').click(); };
$('#file-photo').onchange = (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      // downscale for storage
      const maxD = 1600, k = Math.min(1, maxD / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const src = c.toDataURL('image/jpeg', 0.82);
      const vw = (sk.W * 0.9) / view.s; const vh = vw * (c.height / c.width); const ctr = toW([sk.W / 2, sk.H / 2]);
      underlay = { src, x: ctr[0] - vw / 2, y: ctr[1] - vh / 2, w: vw, h: vh, opacity: 0.5 };
      loadUnderlayImg(); saveUnderlay(); setTool('draw'); toast('Photo placed. Trace over it with Draw.', { label: 'Adjust', fn: openUnderlaySheet });
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
};
function loadUnderlayImg() { if (!underlay) { underlayImg = null; return; } const im = new Image(); im.onload = () => { underlayImg = im; render(); }; im.src = underlay.src; }
function saveUnderlay() { if (underlay) { if (!store.set('napkin.underlay.v1', JSON.stringify(underlay))) store.del('napkin.underlay.v1'); } else store.del('napkin.underlay.v1'); }
function clearUnderlay() { underlay = null; underlayImg = null; saveUnderlay(); render(); }
function openUnderlaySheet() {
  openSheet(`<div class="head"><div><h2>Photo underlay</h2><div class="sub">Trace over a paper sketch</div></div><button class="iconbtn" data-close aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="field" style="margin-bottom:12px"><label for="u-op">Opacity</label><input type="range" id="u-op" min="0.1" max="1" step="0.05" value="${underlay.opacity}"></div>
    <div class="field" style="margin-bottom:14px"><label for="u-sc">Size</label><input type="range" id="u-sc" min="-1" max="1" step="0.01" value="0"></div>
    <div class="row"><button class="btn" id="u-new"><svg class="i"><use href="#i-image"/></svg>Replace photo</button><button class="btn danger" id="u-del"><svg class="i"><use href="#i-trash"/></svg>Remove photo</button></div>`, { kind: 'underlay' });
  const base = { ...underlay };
  $('#u-op').oninput = (e) => { underlay.opacity = +e.target.value; render(); saveUnderlay(); };
  $('#u-sc').oninput = (e) => { const f = Math.pow(3, +e.target.value); const cx = base.x + base.w / 2, cy = base.y + base.h / 2; underlay.w = base.w * f; underlay.h = base.h * f; underlay.x = cx - underlay.w / 2; underlay.y = cy - underlay.h / 2; render(); saveUnderlay(); };
  $('#u-new').onclick = () => $('#file-photo').click();
  $('#u-del').onclick = () => { clearUnderlay(); closeSheet(); };
}

// Keyboard (desktop / tablets with keyboards)
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input')) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); }
  else if (e.key === 'Escape') { closeSheet(); closeMenu(); sel = null; render(); }
  else if (mode === 'sketch' && !e.ctrlKey && !e.metaKey) { const map = { d: 'draw', m: 'dim', s: 'select', l: 'line', r: 'rect', c: 'circle', e: 'erase' }; if (map[k]) setTool(map[k]); }
});

/* Example: an L-bracket with two mounting holes */
function loadExample() {
  doc.sketch.shapes = [
    { id: uid(), type: 'poly', closed: true, pts: [[0, 0], [80, 0], [80, 16], [16, 16], [16, 50], [0, 50]], dims: { 0: 80, 1: 16, 5: 50 } },
    { id: uid(), type: 'circle', c: [8, 40], r: 3, dim: 6, dims: {} },
    { id: uid(), type: 'circle', c: [66, 8], r: 3, dim: 6, dims: {} },
  ];
  clearParts();
  const regions = buildRegions(); const c = regionsCenter(regions);
  const recipe = { kind: 'extrude', depth: 6, regions: regions.map((r) => ({ outer: shapeRecipe(r.sh, c), holes: r.holes.map((h) => shapeRecipe(h.sh, c)) })) };
  addPart({ name: 'Example bracket', recipe, pos: [0, 0, 0] }, false);
  sel = null; sel3 = null; closeSheet(); fitSketch(); render(); updateHint(); updateFab();
  if (T.ready) setView('iso');
}

/* =========================================================================
   Boot
   ========================================================================= */
readTokens();
const themeChanged = () => { readTokens(); render(); theme3D(); refresh3DSelection(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeChanged);
new MutationObserver(themeChanged).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });
new ResizeObserver(() => { if (mode === 'sketch') resizeSketch(); }).observe($('#stage'));
let saved = null; try { saved = JSON.parse(store.get('napkin.doc.v1') || 'null'); } catch {}
resizeSketch();
if (saved && saved.doc) {
  doc.sketch = saved.doc.sketch || { shapes: [] }; (saved.doc.parts || []).forEach((p) => addPart(p, false)); if (saved.view) view = saved.view;
} else { loadExample(); }
try { underlay = JSON.parse(store.get('napkin.underlay.v1') || 'null'); } catch { underlay = null; } loadUnderlayImg();
hist.cur = serialize(); updateUndo(); updateHint(); updateFab(); render();
if (!saved) setTimeout(() => toast('Example loaded. Tap ⋯ › New project to start your own.', null, 5000), 600);

// Offline support when hosted as a standalone app
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.claude && window.top === window.self) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.__napkin = { doc, Digits, recognize, setEdgeDim, buildRegions, view: () => view, toS, toW, exportModel, toSTL, runBoolean, get parts() { return doc.parts; } };
